<header class="page-hero page-hero--compact"><div class="shell"><p class="eyebrow">DuoFiller</p><h1>{{ i18n "cart_title" }}</h1><p>{{ i18n "cart_intro" }}</p></div></header>
<section class="section catalog-section"><div class="cart-layout shell" data-cart-root><div class="cart-lines" data-cart-lines><p>{{ i18n "cart_empty" }}</p></div><aside class="cart-summary"><h2 class="subhead">{{ i18n "cart_summary" }}</h2><div class="cart-summary-row"><span>{{ i18n "cart_products" }}</span><strong data-cart-total data-store-currency="{{ if eq .Language.Lang `nb` }}NOK{{ else }}USD{{ end }}"></strong></div><button class="button button-primary" type="button" data-cart-checkout>{{ i18n "cart_checkout" }}</button><p data-cart-error role="alert"></p><a href="{{ partial "checked-url.html" (dict "page" . "url" "/collections/all/") }}">{{ i18n "cart_browse" }}</a></aside></div></section>
