version: 2
updates:
- package-ecosystem: npm
  schedule:
    interval: cron
    cronjob: 0 4 1 1,7 *
  groups:
    npm-development:
      dependency-type: development
  open-pull-requests-limit: 5
  directories:
  - /
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: cron
    cronjob: 0 4 1 1,7 *
  groups:
    github-actions:
      patterns:
      - '*'
  open-pull-requests-limit: 5
