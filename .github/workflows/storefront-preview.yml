name: Preview managed storefront
run-name: Preview ${{ github.event.client_payload.repository_id }}/${{ github.event.client_payload.pull_request }}/${{ github.event.client_payload.run_id }}/${{ github.event.client_payload.attempt }}/${{ github.event.client_payload.artifact_name }}
on:
  repository_dispatch:
    types: [storefront-preview]
permissions:
  contents: read
  id-token: write
concurrency:
  group: storefront-preview-${{ github.event.client_payload.repository_id }}-${{ github.event.client_payload.pull_request }}-${{ github.event.client_payload.artifact_name }}
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: npm install --global --no-fund wrangler@4.149.0
      - name: Authorize the current PR preview
        id: authorize
        env:
          API_BASE_URL: ${{ github.event.client_payload.api_base_url }}
          REPOSITORY_ID: ${{ github.event.client_payload.repository_id }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.run_id }}
          SOURCE_ATTEMPT: ${{ github.event.client_payload.attempt }}
          PULL_REQUEST: ${{ github.event.client_payload.pull_request }}
          PR_SHA: ${{ github.event.client_payload.sha }}
          ARTIFACT_NAME: ${{ github.event.client_payload.artifact_name }}
        run: |
          node --input-type=module <<'JS'
          import { writeFile, mkdir } from 'node:fs/promises';
          const identity = await fetch(process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=reai-storefront', {
            headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }
          });
          if (!identity.ok) throw new Error('GitHub identity request failed');
          const { value } = await identity.json();
          console.log('::add-mask::' + value);
          const response = await fetch(process.env.API_BASE_URL + '/online-store/preview/authorize', {
            method: 'POST', headers: { Authorization: 'Bearer ' + value, 'Content-Type': 'application/json' },
            body: JSON.stringify({ repositoryId: Number(process.env.REPOSITORY_ID), runId: Number(process.env.SOURCE_RUN_ID),
              attempt: Number(process.env.SOURCE_ATTEMPT), pullRequest: Number(process.env.PULL_REQUEST),
              sha: process.env.PR_SHA, artifactName: process.env.ARTIFACT_NAME })
          });
          if (!response.ok) throw new Error('Preview is no longer authorized: ' + response.status);
          const deployment = await response.json();
          if (deployment.credential) console.log('::add-mask::' + deployment.credential);
          if (!/^[a-z0-9][a-z0-9-]{0,62}$/.test(deployment.workerName) || !['publish', 'remove'].includes(deployment.command)) throw new Error('Invalid preview configuration');
          await writeFile(process.env.RUNNER_TEMP + '/preview-deployment.json', JSON.stringify(deployment), { mode: 0o600 });
          await writeFile(process.env.GITHUB_OUTPUT, 'command=' + deployment.command + '\n', { flag: 'a' });
          await writeFile(process.env.RUNNER_TEMP + '/preview-config.json', JSON.stringify({
            name: deployment.workerName, main: 'worker.js', compatibility_date: deployment.compatibilityDate,
            workers_dev: true, vars: deployment.vars, compatibility_flags: deployment.compatibilityFlags,
            ...(deployment.assets ? { assets: deployment.assets } : {})
          }));
          JS
      - name: Create read-only artifact token
        if: steps.authorize.outputs.command == 'publish'
        id: artifact-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.STOREFRONT_GITHUB_APP_ID }}
          private-key: ${{ secrets.STOREFRONT_GITHUB_PRIVATE_KEY }}
          owner: beint-no
          repositories: ${{ github.event.client_payload.repository }}
          permission-actions: read
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.authorize.outputs.command == 'publish'
        with:
          name: ${{ github.event.client_payload.artifact_name }}
          path: ${{ runner.temp }}/preview-artifact
          github-token: ${{ steps.artifact-token.outputs.token }}
          repository: beint-no/${{ github.event.client_payload.repository }}
          run-id: ${{ github.event.client_payload.run_id }}
      - name: Publish or remove isolated preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STOREFRONT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STOREFRONT_CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.client_payload.pull_request }}
          SITE_CREDENTIAL_BINDING: REAI_SITE_CREDENTIAL
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --input-type=module <<'JS'
          import { readFile, lstat, readdir } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const root = process.env.RUNNER_TEMP;
          async function inspect(directory) {
            for (const entry of await readdir(directory)) {
              const target = directory + '/' + entry;
              const stat = await lstat(target);
              if (stat.isSymbolicLink()) throw new Error('Preview artifacts cannot contain symlinks');
              if (stat.isDirectory()) await inspect(target);
            }
          }
          const deployment = JSON.parse(await readFile(root + '/preview-deployment.json', 'utf8'));
          if (deployment.command === 'publish') await inspect(root + '/preview-artifact');
          for (let attempt = 0; ; attempt++) {
            try {
              execFileSync('node', ['.github/preview/preview.mjs', deployment.command, root + '/preview-config.json', root + '/preview-artifact'], {
                stdio: 'inherit', env: { ...process.env, REAI_PREVIEW_CREDENTIAL: deployment.credential ?? '', SITE_CREDENTIAL_BINDING: deployment.credentialBinding }
              });
              break;
            } catch (error) {
              if (attempt === 2) throw error;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          JS
